global:
  scrape_interval: 5s

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # FastAPI (ML API)
  - job_name: "fastapi"
    metrics_path: /metrics
    static_configs:
      - targets: ["fastapi:8000"]

  # Airflow (only if statsd exporter exists)
  - job_name: "airflow"
    static_configs:
      - targets: ["airflow:8080"]


rule_files:
  - /etc/prometheus/alerts.yml