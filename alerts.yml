groups:
  - name: mlops-alerts
    rules:

      - alert: HighErrorRate
        expr: rate(prediction_errors_total[5m]) / rate(api_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: High prediction error rate

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(api_request_latency_seconds_bucket[5m])) > 0.2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: High API latency

      - alert: DataDriftDetected
        expr: data_drift_score > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Data drift detected

      - alert: ModelNotLoaded
        expr: model_loaded == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Model not loaded

      - alert: APIDown
        expr: up{job="fastapi"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: FastAPI down

      - alert: HighLoad
        expr: api_requests_in_progress > 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: High load